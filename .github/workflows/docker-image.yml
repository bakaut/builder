# .github/workflows/mirror-image.yml

name: Mirror Docker image

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: "Public source image"
        required: true
        default: "nginx:latest"

      target_image:
        description: "Docker Hub image, without registry prefix"
        required: true
        default: "bakaut/nginx:latest"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull source image
        run: |
          docker pull "${{ inputs.source_image }}"

      - name: Tag image
        run: |
          docker tag \
            "${{ inputs.source_image }}" \
            "docker.io/${{ inputs.target_image }}"

      - name: Push image
        run: |
          docker push "docker.io/${{ inputs.target_image }}"
